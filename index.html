<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#101218">
<title>InkNexus</title>
<meta name="description" content="Every series. One place. Track webtoons and manhwa, switch sources, and read in a vertical long-strip reader.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="InkNexus">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:type" content="website">
<meta property="og:title" content="InkNexus">
<meta property="og:description" content="Every series. One place.">
<meta property="og:image" content="https://raw.githubusercontent.com/Chris-203/inknexus/main/assets/cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://raw.githubusercontent.com/Chris-203/inknexus/main/assets/cover.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#101218;--surface:#191d27;--line:#2a3040;--text:#e9e7f2;--muted:#8d92a6;--accent:#9db8ff;--amber:#f0c36a;
--head:'Bricolage Grotesque',system-ui,sans-serif;--body:system-ui,-apple-system,'Segoe UI',sans-serif;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
h1,h2{font-family:var(--head);margin:0}
header{display:flex;align-items:baseline;justify-content:space-between;padding:18px 16px 10px}
header h1{font-size:28px}
.sub,.hint{color:var(--muted)}
.hint{padding:8px 16px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px;padding:8px 16px}
.card{background:none;border:0;padding:0;text-align:left;position:relative;cursor:pointer}
.card img,.cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;background:var(--surface);display:block}
.badge{position:absolute;top:6px;left:6px;background:var(--amber);color:#1b1500;font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px}
.ct{display:block;margin-top:6px;font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{background:var(--accent);color:#0c1330;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.danger{background:transparent;color:#ff9a9a;border:1px solid #4a2a2f}
.row{display:flex;gap:8px;padding:4px 16px 12px}
.row input{flex:1;min-width:0}
input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:8px;padding:8px 16px 16px}
.res{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.res img{width:52px;aspect-ratio:2/3;object-fit:cover;border-radius:4px;background:var(--surface);flex:none}
.res div{flex:1;min-width:0}
.res p{margin:2px 0 0;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
details.manual{margin:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.manual summary{padding:12px 14px;cursor:pointer;font-weight:700}
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty .restore{max-width:34ch;margin:28px auto 12px;font-size:14px}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
#nav button{flex:1;background:none;border:0;padding:14px;color:var(--muted);font-weight:700;cursor:pointer}
#nav button.on{color:var(--accent)}
.top{display:flex;gap:14px;padding:16px}
.top .cover{width:96px;flex:none}
.top h2{font-size:22px;line-height:1.15}
.step{display:flex;align-items:center;gap:8px;margin-top:10px}
.step input{width:78px;text-align:center;-moz-appearance:textfield;appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;padding:0}
.chips{display:flex;gap:8px;padding:4px 16px 12px;overflow-x:auto}
.chip{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent);color:#0c1330;border-color:var(--accent);font-weight:700}
.ch{display:flex;justify-content:space-between;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:13px 16px;text-align:left;cursor:pointer}
.ch span{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.read{opacity:.45}
.credit{color:var(--muted);font-size:13px;padding:10px 16px;margin:0}
.credit a{color:var(--accent);display:inline-block;padding:6px 0}
.pad{padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.rbar{position:sticky;top:0;z-index:4;background:rgba(16,18,24,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.rbar button{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:38px;height:38px;font-size:20px;cursor:pointer;padding:0}
.rbar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe.frame{display:block;width:100%;height:calc(100dvh - 110px);border:0;background:#fff}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets .chip{padding:5px 11px;font-size:13px}
.ren{background:none;border:0;color:var(--muted);font-size:17px;cursor:pointer;min-width:36px;min-height:36px;padding:0;vertical-align:middle}
.ch b.nm{font-weight:600;overflow-wrap:anywhere}
.tag{font-size:11px;color:var(--accent);border:1px solid var(--line);border-radius:99px;padding:0 7px;margin-left:6px;vertical-align:middle;font-weight:400}
#strip{max-width:820px;margin:0 auto}
#strip img{width:100%;display:block;min-height:240px;background:var(--surface)}
.endbar{display:flex;gap:10px;padding:20px 16px}
.endbar .btn{flex:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none;align-items:flex-end}
#modal.on{display:flex}
#modal .sheet{background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-height:85%;overflow:auto;padding:18px 0 calc(18px + env(safe-area-inset-bottom,0px))}
#modal h2{padding:0 16px 10px;font-size:20px}
#modal .btn{margin:0 16px 10px;display:block;width:calc(100% - 32px)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:#111;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"><button data-a="tab" data-id="library">Library</button><button data-a="tab" data-id="search">Find</button></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="imp" accept="application/json" hidden>

<script>
/* ---------- storage ---------- */
let S={lib:[]};
try{S=JSON.parse(localStorage.getItem('longstrip')||'')||S}catch(e){}
/* storage key stays 'longstrip' on purpose so libraries saved before the rename keep loading */
const save=()=>{try{localStorage.setItem('longstrip',JSON.stringify(S))}catch(e){}};

/* ---------- sources ----------
   Each reader source implements: search(q), chapters(ref), pages(chapterId).
   Add another licensed/open API here and it shows up everywhere. */
const MD='https://api.mangadex.org';
const RELAY='/api/mangadex'; // same-origin Vercel Function (api/mangadex.js)
const apiHint=st=>st===429?'MangaDex is rate-limiting, wait a minute and try again'
  :st===403?'request refused; reload the page and try again'
  :st===404?'not found on MangaDex'
  :st>=500?'MangaDex or the relay is down, try again later'
  :'try again later';
const api=async u=>{
  let r;
  try{r=await fetch(`${RELAY}?url=${encodeURIComponent(u)}`)}
  catch(e){throw new Error('network error; check your connection and try again')}
  if(!r.ok)throw new Error(`HTTP ${r.status}: ${apiHint(r.status)}`);
  return r;
};
const why=e=>(e&&e.message)||'unknown error';
const RATING='&contentRating[]=safe&contentRating[]=suggestive';
/* Every name MangaDex has for a series, English first, then romanized, then the rest. */
const mdNames=a=>{
  const out=[],seen=new Set(),add=(l,n)=>{n=(n||'').trim();if(n&&!seen.has(n.toLowerCase())){seen.add(n.toLowerCase());out.push({l,n})}};
  for(const [l,n] of Object.entries(a.title||{}))add(l,n);
  for(const t of a.altTitles||[])for(const [l,n] of Object.entries(t))add(l,n);
  const rank=l=>l==='en'?0:/-ro$/.test(l)?1:2;
  return out.sort((p,q)=>rank(p.l)-rank(q.l));
};
const langName=l=>{try{const n=new Intl.DisplayNames(['en'],{type:'language'});return /-ro$/.test(l)?n.of(l.slice(0,-3))+' (romanized)':n.of(l)}catch(e){return l}};
const Sources={
  mangadex:{
    name:'MangaDex',
    async search(q){
      const r=await api(`${MD}/manga?title=${encodeURIComponent(q)}&limit=20&includes[]=cover_art&order[relevance]=desc${RATING}`);
      const j=await r.json();
      return (j.data||[]).map(m=>{
        const c=(m.relationships.find(x=>x.type==='cover_art')||{}).attributes;
        const d=(m.attributes.description||{}).en||'';
        return {src:'md',ref:m.id,title:(mdNames(m.attributes)[0]||{}).n||'Untitled',desc:d,
          cover:c?`https://uploads.mangadex.org/covers/${m.id}/${c.fileName}.256.jpg`:''};
      });
    },
    async chapters(ref){
      let out=[],off=0,total=1;
      while(off<total&&off<3000){
        const r=await api(`${MD}/manga/${ref}/feed?translatedLanguage[]=en&order[chapter]=asc&limit=500&offset=${off}&includes[]=scanlation_group${RATING}`);
        const j=await r.json();
        total=j.total||0;off+=500;out.push(...(j.data||[]));
      }
      const byNum=new Map();
      for(const c of out){
        const n=parseFloat(c.attributes.chapter);if(isNaN(n))continue;
        const ext=c.attributes.externalUrl||'';
        if(!ext&&!(c.attributes.pages>0))continue;
        const cur=byNum.get(n);
        if(cur&&(!cur.ext||ext))continue;
        const grp=(c.relationships||[]).filter(r=>r.type==='scanlation_group'&&r.attributes).map(r=>r.attributes.name).join(' & ');
        byNum.set(n,{id:c.id,num:n,title:c.attributes.title||'',ext,grp});
      }
      const res=[...byNum.values()].sort((a,b)=>a.num-b.num);
      res.listed=out.length; // English chapters MangaDex returned, before dropping unreadable ones
      return res;
    },
    async pages(id){
      const j=await (await api(`${MD}/at-home/server/${id}`)).json();
      return j.chapter.dataSaver.map((f,i)=>({a:`${j.baseUrl}/data-saver/${j.chapter.hash}/${f}`,b:j.chapter.data[i]?`${j.baseUrl}/data/${j.chapter.hash}/${j.chapter.data[i]}`:''}));
    }
  }
  ,
  anilist:{
    name:'AniList',
    async search(q){
      const query=`query($q:String){Page(perPage:15){media(search:$q,type:MANGA,sort:SEARCH_MATCH){id title{romaji english} coverImage{large} description(asHtml:false) externalLinks{site url type language}}}}`;
      const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({query,variables:{q}})});
      const j=await r.json();
      return j.data.Page.media.map(m=>({src:'al',ref:m.id,title:m.title.english||m.title.romaji,cover:m.coverImage.large||'',
        desc:(m.description||'').replace(/<[^>]+>/g,''),
        links:(m.externalLinks||[]).filter(l=>l.type==='STREAMING'&&(!l.language||l.language==='English')&&!/webtoon/i.test(l.site)).map(l=>({label:l.site,url:l.url}))}));
    }
  }
};

/* ---------- helpers ---------- */
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return 'Link'}};
const find=id=>S.lib.find(x=>x.id===id);
const uid=()=>(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
const cache={},chErr={};
let V={name:'library'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3200)}
function go(v){V=v;render();window.scrollTo(0,0)}
function modal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
function addItem(o){
  const x={id:uid(),title:o.title,cover:o.cover||'',md:o.md||null,al:o.al||null,links:o.links||[],last:o.last||0,t:Date.now()};
  S.lib.push(x);save();return x;
}
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
/* Link-only sites: a name and the site's main address, prefilled so you only add the series path.
   Sites move domains often; edit the address here when one changes. */
const PRESETS=[['Asura Scans','https://asuracomic.net/'],['Thunder Scans','https://en-thunderscans.com/'],['Comix','https://comix.to/'],
  ['Tapas','https://tapas.io/'],['MANGA Plus','https://mangaplus.shueisha.co.jp/']];
const presetHtml=()=>`<div class="presets">${PRESETS.map(([n],i)=>`<button type="button" class="chip" data-a="preset" data-i="${i}">${n}</button>`).join('')}</div>`;
function parseChUrl(u){
  let o;try{o=new URL(u)}catch(e){return null}
  const rest=u.slice(o.origin.length);
  const re=/(?:^|[\/\-_=])(?:chapter|chap|ch|episode|ep|c)[-_\/ .=]?(\d+)(?:[-_.](\d))?(?!\d)/gi;
  let m,hit=null;while((m=re.exec(rest)))hit=m;
  if(!hit)return null;
  const tail=hit[0].match(/\d+(?:[-_.]\d)?$/)[0];
  const start=hit.index+hit[0].length-tail.length;
  const cut=hit[0][0]==='/'?hit.index:rest.lastIndexOf('/',hit.index);
  const seg=rest.slice(rest.lastIndexOf('/',hit.index+1)+1);
  const idPrefixed=/^\d{4,}-/.test(seg);
  return {num:parseFloat(hit[1]+(hit[2]?'.'+hit[2]:'')),
    tpl:idPrefixed?'':o.origin+rest.slice(0,start)+'{n}'+rest.slice(start+tail.length),
    series:o.origin+rest.slice(0,Math.max(cut,0)),idPrefixed};
}
const fmt=n=>Number.isInteger(n)?n:+n.toFixed(1);

/* ---------- views ---------- */
function render(){
  $('#nav').style.display=(V.name==='reader'||V.name==='frame')?'none':'flex';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===(V.name==='search'?'search':'library')));
  ({library:vLibrary,search:vSearch,series:vSeries,reader:vReader,frame:vFrame})[V.name]();
}

function vLibrary(){
  const l=[...S.lib].sort((a,b)=>(b.t||0)-(a.t||0));
  app.innerHTML=`<header><h1>Library</h1><span class="sub">${l.length} ${l.length===1?'series':'series'}</span></header>`+
  (l.length?`<div class="grid">${l.map(x=>`<button class="card" data-a="series" data-id="${x.id}">
    ${x.cover?`<img src="${esc(x.cover)}" loading="lazy" alt="">`:`<div class="cover"></div>`}
    <span class="badge">Ch. ${fmt(x.last||0)}</span><span class="ct">${esc(x.title)}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost sm" data-a="export">Export backup</button><button class="btn ghost sm" data-a="import">Import backup</button></div>`
  :`<div class="empty"><p>Your library is empty.</p><button class="btn" data-a="tab" data-id="search">Find a series</button>
    <p class="restore">Used InkNexus before, in another browser or on another device? Each one keeps its own library. Import the backup file you exported there.</p>
    <button class="btn ghost" data-a="import">Import backup</button></div>`);
}

function resList(r){
  if(!r.length)return '<p class="hint">No matches. Try another spelling, or add it by link below.</p>';
  return r.map((o,i)=>{
    const ex=o.src==='md'?S.lib.find(x=>x.md===o.ref):S.lib.find(x=>x.al===o.ref||norm(x.title)===norm(o.title));
    return `<div class="res"><img src="${esc(o.cover)}" loading="lazy" alt=""><div><b>${esc(o.title)}</b><span class="tag">${o.src==='md'?'MangaDex':'AniList'}</span><p>${esc(o.desc)}</p></div>
    <button class="btn sm" data-a="${ex?'series':'add'}" data-id="${ex?ex.id:''}" data-i="${i}">${ex?'Open':'Add'}</button></div>`}).join('');
}

function vSearch(){
  app.innerHTML=`<header><h1>Find</h1></header>
  <form id="sf" class="row"><input id="q" placeholder="Search by title" value="${esc(V.q||'')}" autocomplete="off"><button class="btn">Search</button></form>
  <div id="res">${V.res?resList(V.res):'<p class="hint">MangaDex gives you a built-in reader. AniList adds official reading links. For any other site, add it by link.</p>'}</div>
  <details class="manual"><summary>Add by link</summary>
  <form id="mf" class="stack"><input name="title" placeholder="Title" required>
  ${presetHtml()}<input name="label" placeholder="Site name (optional)"><input name="url" type="url" placeholder="https://…" required>
  <input name="ch" type="number" step="any" min="0" placeholder="Chapter you're on (optional if the link has one)"><button class="btn">Add to library</button></form></details>`;
}

function vSeries(){
  const x=find(V.id);if(!x)return go({name:'library'});
  const all=[...(x.md?[{k:'md',n:'MangaDex',h:x.mdh}]:[]),...x.links.map((l,i)=>({k:'l'+i,n:l.label||host(l.url),h:l.h}))];
  const vis=all.filter(q=>!q.h);
  let cur=V.src||x.src;
  if(!vis.some(q=>q.k===cur))cur=vis[0]?vis[0].k:'';
  V.src=cur;
  let body='',cta='';
  if(V.src==='md'){
    const chs=cache[x.md];
    if(!chs){
      body='<p class="hint">Loading chapters…</p>';
      Sources.mangadex.chapters(x.md).then(c=>{cache[x.md]=c;delete chErr[x.md]}).catch(e=>{cache[x.md]=[];chErr[x.md]=why(e)})
        .finally(()=>{if(V.name==='series'&&V.id===x.id)render()});
    }else if(chErr[x.md]){
      body=`<p class="hint">Could not load chapters from MangaDex (${esc(chErr[x.md])}).</p><div class="pad"><button class="btn ghost" data-a="retrych">Try again</button></div>`;
    }else if(!chs.length){
      body=chs.listed?`<p class="hint">MangaDex lists ${chs.listed} English chapter${chs.listed===1?'':'s'} for this title, but none can be read here (removed or hosted elsewhere). Add an official link with + Source.</p>`
        :'<p class="hint">MangaDex has no English chapters for this title. Add an official link with + Source, or switch to another source.</p>';
    }else{
      const next=chs.find(c=>c.num>(x.last||0));
      cta=next?`<div class="pad"><button id="cont" class="btn" data-a="read" data-cont="1" data-n="${next.num}">${x.last?'Continue':'Start'} with ch. ${fmt(next.num)}</button></div>`
               :`<p class="hint">You're caught up on this source.</p>`;
      const asc=S.sort==='asc',list=asc?chs:[...chs].reverse();
      body=`<div class="row" style="align-items:center"><button class="btn ghost sm" data-a="sort">Sort: ${asc?'oldest first':'newest first'}</button><span class="sub">${chs.length} chapters, ${fmt(chs[0].num)} to ${fmt(chs[chs.length-1].num)}</span></div>`+
        (chs[0].num>1?`<p class="hint">Chapters before ${fmt(chs[0].num)} are not on MangaDex. Try another source for those.</p>`:'')+
        list.map(c=>`<button class="ch ${c.num<=(x.last||0)?'read':''}" data-a="read" data-n="${c.num}"><b>Ch. ${fmt(c.num)}</b><span>${esc([c.ext?'Official site ↗':c.title,c.grp].filter(Boolean).join(' · '))}</span></button>`).join('');
    }
    body+=`<p class="credit">Chapters and data from MangaDex. Scanlation groups are credited on each chapter. <a href="https://mangadex.org/title/${esc(x.md)}" target="_blank" rel="noopener noreferrer">View on MangaDex ↗</a></p>`;
  }else if(V.src[0]==='l'){
    const i=+V.src.slice(1),l=x.links[i];
    if(l){const nx=Math.floor(x.last||0)+1;body=`<div class="pad">${l.resume?`<button class="btn" data-a="frame" data-i="${i}" data-resume="1">Resume ch. ${fmt(l.rn||0)} (saved link)</button>`:''}${l.tpl?`<button id="cont" class="btn" data-a="frame" data-cont="1" data-i="${i}" data-n="${nx}">Continue with ch. ${nx}</button>`:''}
      <button class="btn ${(l.tpl||l.resume)?'ghost':''}" data-a="frame" data-i="${i}">Open the series page in app</button>
      <button class="btn ghost" data-a="paste" data-i="${i}">Update chapter from a link</button>
      <a class="btn ghost" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">Open in browser</a>
      <p class="hint" style="padding:0">Copy a chapter link from the site, then tap Update. InkNexus reads the chapter number and, where the site's links allow it, learns the pattern so Continue works. If the in-app view is blank, the site blocks embedding: use Open in browser.</p>
      <button class="btn danger sm" data-a="rmlink" data-i="${i}">Remove this source</button></div>`}
  }else body=all.length?'<p class="hint">All sources are hidden. Bring one back with + Source.</p>':'<p class="hint">No sources yet. Add one with + Source.</p>';
  app.innerHTML=`<div class="rbar" style="position:static;background:none;border:0;backdrop-filter:none;margin:0;padding-bottom:0"><button data-a="tab" data-id="library" aria-label="Back">‹</button></div>
  <div class="top">${x.cover?`<img class="cover" src="${esc(x.cover)}" alt="">`:`<div class="cover"></div>`}
  <div style="flex:1;min-width:0"><h2>${esc(x.title)} <button class="ren" data-a="names" aria-label="Change name">✎</button></h2><div class="sub" style="margin-top:6px">Last chapter read</div>
  <div class="step"><button data-a="dec" aria-label="Previous chapter">−</button><input id="last" type="number" step="any" min="0" value="${x.last||0}"><button data-a="inc" aria-label="Next chapter">+</button></div></div></div>
  ${cta}
  <div class="chips">${vis.map(q=>`<button class="chip ${V.src===q.k?'on':''}" data-a="src" data-id="${q.k}">${esc(q.n)}</button>`).join('')}<button class="chip" data-a="addsrc">+ Source</button></div>
  ${V.src?`<div class="row" style="padding-top:0"><button class="btn ghost sm" data-a="hide" data-id="${V.src}">Hide this source</button></div>`:''}
  ${body}
  <div class="pad" style="margin-top:20px"><button class="btn danger sm" data-a="rm">Remove from library</button></div>`;
}

async function vReader(){
  const x=find(V.id),chs=cache[x.md]||[],c=chs.find(k=>k.num===V.n);
  const tok=V.tok=Date.now();
  app.innerHTML=`<div class="rbar"><button data-a="back" aria-label="Back to series">‹</button><b>${esc(x.title)} · Ch. ${fmt(V.n)}</b></div><div id="strip"><p class="hint">Loading pages…</p></div>`;
  window.scrollTo(0,0);
  try{
    const pages=await Sources.mangadex.pages(c.id);
    if(V.tok!==tok)return;
    const prev=[...chs].reverse().find(k=>k.num<V.n),next=chs.find(k=>k.num>V.n);
    const credit=`<p class="credit">${c.grp?`Scanlation by ${esc(c.grp)}`:'No scanlation group credited'} · via MangaDex. <a href="https://mangadex.org/chapter/${esc(c.id)}" target="_blank" rel="noopener noreferrer">Read on MangaDex ↗</a></p>`;
    $('#strip').innerHTML=credit+pages.map(u=>`<img src="${esc(u.a)}" data-b="${esc(u.b)}" referrerpolicy="no-referrer" loading="lazy" alt="Page failed to load">`).join('')+
      `<div id="end" class="endbar">${prev?`<button class="btn ghost" data-a="read" data-n="${prev.num}">‹ Ch. ${fmt(prev.num)}</button>`:''}
       ${next?`<button class="btn" data-a="read" data-n="${next.num}">Ch. ${fmt(next.num)} ›</button>`:`<button class="btn" data-a="back">Back to series</button>`}</div>`+credit;
    new IntersectionObserver((en,ob)=>{
      if(en[0].isIntersecting){ob.disconnect();
        if(V.n>(x.last||0)){x.last=V.n;x.t=Date.now();save();toast(`Chapter ${fmt(V.n)} marked read`)}}
    },{threshold:.6}).observe($('#end'));
  }catch(e){if(V.tok===tok)$('#strip').innerHTML='<p class="hint">Could not load this chapter ('+esc(why(e))+'). Try again, or switch to a different source.</p>'}
}

function vFrame(){
  const x=find(V.id),l=x&&x.links[V.i];if(!l)return go({name:'library'});
  const u=V.url||l.url;
  app.innerHTML=`<div class="rbar"><button data-a="fback" aria-label="Back to series">‹</button><b>${esc(l.label||host(l.url))}</b>
  ${V.ch&&l.tpl?`<button data-a="fnext" aria-label="Mark read and open next chapter" style="width:auto;padding:0 10px;font-size:13px">Next ›</button>`:`<button data-a="finc" aria-label="Mark next chapter read" style="width:auto;padding:0 10px;font-size:13px">+1 ch</button>`}
  <button data-a="paste" data-i="${V.i}" aria-label="Update chapter from copied link" style="width:auto;padding:0 10px;font-size:13px">Paste</button>
  <a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Browser</a></div>
  <iframe class="frame" src="${esc(u)}" sandbox="allow-scripts allow-same-origin allow-forms" referrerpolicy="no-referrer" title="${esc(x.title)}"></iframe>`;
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');
  if(e.target.id==='modal')return closeModal();
  if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,x=find(V.id);
  if(a==='tab')go({name:id});
  else if(a==='series')go({name:'series',id});
  else if(a==='add'){
    const o=V.res[+b.dataset.i];
    const n=addItem({title:o.title,cover:o.cover,md:o.src==='md'?o.ref:null,al:o.src==='al'?o.ref:null,links:o.links||[]});
    let msg='Added to library';
    if(o.src==='al'){
      try{const m=await Sources.mangadex.search(o.title);const hit=m.find(k=>norm(k.title)===norm(o.title));
        if(hit){n.md=hit.ref;save();msg='Added. Found it on MangaDex too'}}catch(err){}
    }
    toast(msg);go({name:'series',id:n.id});
  }
  else if(a==='frame'){
    const l=x.links[+b.dataset.i];let n=b.dataset.n?+b.dataset.n:0;
    if(b.dataset.cont)n=Math.floor(x.last||0)+1;
    if(b.dataset.resume)n=l.rn||0;
    go({name:'frame',id:V.id,i:+b.dataset.i,src:V.src,ch:n,url:b.dataset.resume?l.resume:(n&&l.tpl?l.tpl.replace('{n}',n):'')});
  }
  else if(a==='fnext'){
    const l=x.links[V.i],n=V.ch+1;
    x.last=Math.max(x.last||0,V.ch);x.t=Date.now();save();toast(`Chapter ${fmt(V.ch)} marked read`);
    go({name:'frame',id:V.id,i:V.i,src:V.src,ch:n,url:l.tpl.replace('{n}',n)});
  }
  else if(a==='paste'){
    let t='';
    try{t=await navigator.clipboard.readText()}catch(err){t=prompt('Paste the chapter link')||''}
    const r=parseChUrl((t||'').trim());
    if(!r){toast('No chapter number found. Copy a chapter link first.');return}
    const l=x.links[+b.dataset.i];if(l){l.tpl=r.tpl;l.resume=t.trim();l.rn=r.num;if(r.idPrefixed)l.url=r.series}
    x.last=r.num;x.t=Date.now();save();
    toast(`Now on chapter ${fmt(r.num)}`);
    if(V.name!=='frame')render();
  }
  else if(a==='fback')go({name:'series',id:V.id,src:V.src});
  else if(a==='finc'){x.last=Math.floor(x.last||0)+1;x.t=Date.now();save();toast('Now on chapter '+x.last)}
  else if(a==='src'){V.src=id;x.src=id;save();render()}
  else if(a==='hide'){
    if(id==='md')x.mdh=true;else if(x.links[+id.slice(1)])x.links[+id.slice(1)].h=true;
    x.src='';V.src='';save();toast('Hidden. Bring it back from + Source');render();
  }
  else if(a==='unhide'){
    if(id==='md')x.mdh=false;else if(x.links[+id.slice(1)])x.links[+id.slice(1)].h=false;
    x.src=id;V.src=id;save();closeModal();render();
  }
  else if(a==='read'){
    const chs=cache[x.md]||[];let n=parseFloat(b.dataset.n);
    if(b.dataset.cont){const nx=chs.find(c=>c.num>(x.last||0));if(!nx){toast('No later chapter on this source');return}n=nx.num}
    const c=chs.find(k=>k.num===n);
    if(c&&c.ext){window.open(c.ext,'_blank','noopener');toast(`Chapter ${fmt(n)} opens on the official site`);return}
    V.tok=0;closeModal();go({name:'reader',id:V.id,n});
  }
  else if(a==='sort'){S.sort=S.sort==='asc'?'desc':'asc';save();render()}
  else if(a==='retrych'){delete cache[x.md];delete chErr[x.md];render()}
  else if(a==='back')go({name:'series',id:V.id,src:'md'});
  else if(a==='inc'||a==='dec'){x.last=Math.max(0,Math.floor(x.last||0)+(a==='inc'?1:-1));x.t=Date.now();save();render()}
  else if(a==='rm'){if(confirm('Remove this series from your library?')){S.lib=S.lib.filter(k=>k.id!==x.id);save();go({name:'library'})}}
  else if(a==='rmlink'){x.links.splice(+b.dataset.i,1);x.src='';V.src='';save();render()}
  else if(a==='addsrc'){
    const hid=[...(x.md&&x.mdh?[{k:'md',n:'MangaDex'}]:[]),...x.links.map((l,i)=>({k:'l'+i,n:l.label||host(l.url),h:l.h})).filter(q=>q.h)];
    modal(`<h2>Add a source</h2>
      ${hid.length?`<p class="hint">Hidden sources</p>${hid.map(q=>`<button class="btn ghost" data-a="unhide" data-id="${q.k}">Show ${esc(q.n)}</button>`).join('')}<p class="hint">Or add a new one</p>`:''}
      ${!x.md?`<button class="btn" data-a="findmd">Find it on MangaDex</button>`:''}
      <button class="btn ghost" data-a="findal">Find official links (AniList)</button><div id="mres"></div>
      <form id="lf" class="stack">${presetHtml()}<input name="label" placeholder="Site name (optional)"><input name="url" type="url" required placeholder="Series or chapter link"><button class="btn" style="margin:0;width:100%">Save link</button></form>
      <button class="btn ghost" data-a="close">Close</button>`);
  }
  else if(a==='close')closeModal();
  else if(a==='names'){
    modal(`<h2>Change name</h2><div id="nres">${x.md?'<p class="hint">Loading names from MangaDex…</p>':''}</div>
      <form id="nf" class="stack"><input name="title" value="${esc(x.title)}" required aria-label="Name"><button class="btn" style="margin:0;width:100%">Save this name</button></form>
      <button class="btn ghost" data-a="close">Close</button>`);
    if(x.md){
      let html;
      try{const j=await (await api(`${MD}/manga/${x.md}`)).json();V.names=mdNames(j.data.attributes);
        html=V.names.length?`<p class="hint">Pick a name, or type your own below.</p>`+V.names.map((o,i)=>`<button class="ch" data-a="pickname" data-i="${i}"><b class="nm">${esc(o.n)}${o.n===x.title?' ✓':''}</b><span>${esc(langName(o.l))}</span></button>`).join('')
          :'<p class="hint">MangaDex lists no other names. Type your own below.</p>'}
      catch(err){html=`<p class="hint">Could not load names from MangaDex (${esc(why(err))}). Type a name below, or try again later.</p>`}
      if($('#nres'))$('#nres').innerHTML=html;
    }
  }
  else if(a==='pickname'){x.title=V.names[+b.dataset.i].n;save();closeModal();render();toast('Name changed')}
  else if(a==='preset'){
    const [n,u]=PRESETS[+b.dataset.i],f=b.closest('form'),url=f.querySelector('[name=url]');
    f.querySelector('[name=label]').value=n;
    /* fill the address unless a real link was already pasted */
    if(!url.value.trim()||PRESETS.some(p=>p[1]===url.value.trim())){url.value=u;url.focus();try{url.setSelectionRange(u.length,u.length)}catch(e){}}
  }
  else if(a==='findal'){
    $('#mres').innerHTML='<p class="hint">Searching…</p>';
    try{V.mres=await Sources.anilist.search(x.title);
      $('#mres').innerHTML=V.mres.length?V.mres.map((o,i)=>`<div class="res"><img src="${esc(o.cover)}" alt=""><div><b>${esc(o.title)}</b><p>${o.links.length} official link${o.links.length===1?'':'s'}</p></div><button class="btn sm" style="margin:0;width:auto" data-a="pickal" data-i="${i}">Use</button></div>`).join(''):'<p class="hint">No match on AniList.</p>';
    }catch(err){$('#mres').innerHTML='<p class="hint">Could not reach AniList.</p>'}
  }
  else if(a==='pickal'){
    const o=V.mres[+b.dataset.i];x.al=o.ref;if(!x.cover)x.cover=o.cover;
    let n=0;for(const l of o.links){if(!x.links.some(k=>k.url===l.url)){x.links.push(l);n++}}
    save();closeModal();toast(n?`Added ${n} official link${n===1?'':'s'}`:'No official links listed for this one');
    if(!V.src)V.src=x.md?'md':(x.links.length?'l0':'');render();
  }
  else if(a==='findmd'){
    $('#mres').innerHTML='<p class="hint">Searching…</p>';
    try{V.mres=await Sources.mangadex.search(x.title);
      $('#mres').innerHTML=V.mres.length?V.mres.map((o,i)=>`<div class="res"><img src="${esc(o.cover)}" alt=""><div><b>${esc(o.title)}</b></div><button class="btn sm" style="margin:0;width:auto" data-a="pickmd" data-i="${i}">Use</button></div>`).join(''):'<p class="hint">No match on MangaDex.</p>';
    }catch(err){$('#mres').innerHTML='<p class="hint">Could not reach MangaDex ('+esc(why(err))+').</p>'}
  }
  else if(a==='pickmd'){
    const o=V.mres[+b.dataset.i];x.md=o.ref;x.mdh=false;if(!x.cover)x.cover=o.cover;V.src='md';x.src='md';save();closeModal();render();
  }
  else if(a==='export'){
    const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
    const l=document.createElement('a');l.href=u;l.download='inknexus-backup.json';l.click();URL.revokeObjectURL(u);
  }
  else if(a==='import')$('#imp').click();
});

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='sf'){
    V.q=$('#q').value.trim();if(!V.q)return;
    $('#res').innerHTML='<p class="hint">Searching…</p>';
    try{
    const [a1,b1]=await Promise.allSettled([Sources.mangadex.search(V.q),Sources.anilist.search(V.q)]);
    if(a1.status==='rejected'&&b1.status==='rejected')throw 0;
    V.res=[...(a1.value||[]),...(b1.value||[])];$('#res').innerHTML=resList(V.res);
    if(a1.status==='rejected')toast('MangaDex failed ('+((a1.reason&&a1.reason.message)||'blocked')+'). Showing AniList only.');
    if(b1.status==='rejected')toast('AniList failed ('+((b1.reason&&b1.reason.message)||'blocked')+'). Showing MangaDex only.')}
    catch(err){$('#res').innerHTML='<p class="hint">Could not reach MangaDex or AniList. Check your connection and try again, or add the series by link.</p>'}
  }else if(f.id==='mf'){
    const d=new FormData(f);
    let url=d.get('url').trim();const r=parseChUrl(url),given=parseFloat(d.get('ch'));
    if(r&&r.idPrefixed)url=r.series;
    const n=addItem({title:d.get('title').trim(),links:[{label:d.get('label').trim(),url,tpl:r?r.tpl:'',resume:r?d.get('url').trim():'',rn:r?r.num:0}],last:given||(r?r.num:0)});
    toast(r&&!given?`Added. Detected chapter ${fmt(r.num)} from the link`:'Added to library');go({name:'series',id:n.id});
  }else if(f.id==='nf'){
    const t=new FormData(f).get('title').trim(),x=find(V.id);
    if(t){x.title=t;save();closeModal();render();toast('Name changed')}
  }else if(f.id==='lf'){
    const d=new FormData(f),x=find(V.id);
    let url=d.get('url').trim();const r=parseChUrl(url);
    if(r&&r.idPrefixed)url=r.series;
    x.links.push({label:d.get('label').trim(),url,tpl:r?r.tpl:'',resume:r?d.get('url').trim():'',rn:r?r.num:0});
    if(r&&r.num>(x.last||0)){x.last=r.num;toast(`Detected chapter ${fmt(r.num)} from the link`)}
    V.src='l'+(x.links.length-1);x.src=V.src;save();closeModal();render();
  }
});

function syncLast(e){
  const x=find(V.id);x.last=Math.max(0,parseFloat(e.target.value)||0);x.t=Date.now();save();
  const btn=$('#cont');
  if(btn){
    if(V.src==='md'){const nx=(cache[x.md]||[]).find(c=>c.num>x.last);btn.textContent=nx?`${x.last?'Continue':'Start'} with ch. ${fmt(nx.num)}`:'No later chapter on this source';btn.dataset.n=nx?nx.num:''}
    else{const n=Math.floor(x.last)+1;btn.textContent=`Continue with ch. ${n}`;btn.dataset.n=n}
  }
  document.querySelectorAll('.ch[data-n]').forEach(r=>r.classList.toggle('read',parseFloat(r.dataset.n)<=x.last));
}
document.addEventListener('input',e=>{if(e.target.id==='last')syncLast(e)});
document.addEventListener('change',e=>{
  if(e.target.id==='last'){syncLast(e);if(!$('#cont')&&V.src==='md')render()}
  if(e.target.id==='imp'){
    const file=e.target.files[0];if(!file)return;
    file.text().then(t=>{const j=JSON.parse(t);if(Array.isArray(j.lib)){delete j.proxy;S=j;save();render();toast('Backup imported')}else throw 0})
      .catch(()=>toast('That file is not an InkNexus backup'));
    e.target.value='';
  }
});

document.addEventListener('error',e=>{
  const i=e.target;
  if(i.tagName!=='IMG'||!i.closest('#strip'))return;
  if(!i.dataset.t&&i.dataset.b){i.dataset.t=1;i.src=i.dataset.b}
  else if(!toast.shown){toast.shown=1;toast('Some pages failed to load. Try another chapter or source.')}
},true);

(function(){
  /* drop the worker address an old #proxy= setup link saved; MangaDex now goes through /api/mangadex */
  if('proxy' in S){delete S.proxy;save()}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();

render();
</script>
</body>
