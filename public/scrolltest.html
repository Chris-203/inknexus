<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Scroll test</title>
    <style>
      body {
        margin: 0;
        background: #0d0d14;
      }
      div {
        height: 1800px;
        margin-bottom: 4px;
        background: repeating-linear-gradient(#8a8a96 0 60px, #5a5a66 60px 120px);
      }
    </style>
  </head>
  <body>
    <script>
      for (let i = 0; i < 80; i++) document.body.appendChild(document.createElement('div'));
    </script>
  </body>
</html>
